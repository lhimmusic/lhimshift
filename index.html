<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #eef0f4; --panel: #ffffff; --card: #f5f6f8; --text: #15171c; --muted: #7b8290;
    --line: #e3e6eb; --accent: #4f5dff; --roll: #f5f6f8; --grid: #e7e9ee;
    --shadow: 0 8px 32px rgba(20, 24, 40, .07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0e12; --panel: #16181e; --card: #1d2027; --text: #eef0f4; --muted: #8b92a0;
      --line: #2a2e37; --accent: #7a84ff; --roll: #1a1c23; --grid: #262933;
      --shadow: 0 8px 32px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 15px/1.4 "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    width: 100%; max-width: 760px; background: var(--panel); border-radius: 20px;
    padding: 20px 24px 24px; box-shadow: var(--shadow); border: 2px solid transparent; transition: border-color .15s;
  }
  .app.over { border-color: var(--accent); }

  /* 상단 */
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; min-height: 36px; }
  .brand { font-weight: 800; font-size: 17px; letter-spacing: .06em; white-space: nowrap; }
  .brand i { font-style: normal; color: var(--accent); }
  .file { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; gap: 6px; }

  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  button:disabled { opacity: .35; cursor: default; }
  .btn {
    height: 36px; padding: 0 14px; border-radius: 10px; font-size: 14px; font-weight: 600;
    background: var(--card); display: inline-flex; align-items: center; gap: 6px;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn svg { width: 16px; height: 16px; }
  .save-wrap { position: relative; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; min-width: 170px; padding: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  }
  .menu button { display: flex; width: 100%; justify-content: space-between; align-items: baseline; padding: 9px 10px; border-radius: 8px; font-size: 14px; font-weight: 600; }
  .menu button:hover { background: var(--card); }
  .menu small { color: var(--muted); font-size: 12px; font-weight: 500; }

  /* 화면 */
  .stage { position: relative; }
  .stage.empty { cursor: pointer; }
  .stage:not(.empty) canvas { cursor: pointer; }
  canvas { display: block; width: 100%; height: 200px; border-radius: 14px; background: var(--roll); }
  .msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: var(--muted); border-radius: 14px;
    background: color-mix(in srgb, var(--roll) 88%, transparent);
  }
  .msg:empty { display: none; }

  /* 위치 */
  .seekrow { display: flex; align-items: center; gap: 12px; margin: 14px 0 12px; }
  .seekrow input { flex: 1; }
  .t { font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 36px; }
  .t:last-child { text-align: right; }

  /* 재생 줄: 재생 버튼 · 볼륨 · LUFS */
  /* 가운데 재생 버튼, 그 오른쪽에 볼륨 · LUFS (왼쪽 칸은 가운데 정렬용 빈 칸) */
  .transport { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 18px; }
  .ctls { display: flex; align-items: center; gap: 10px; }
  .right { display: flex; align-items: center; min-width: 0; }
  .ctl {
    width: 40px; height: 40px; border-radius: 50%; background: var(--card); flex: none;
    display: inline-flex; align-items: center; justify-content: center; transition: transform .12s;
  }
  .ctl.big { width: 52px; height: 52px; background: var(--accent); color: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent); }
  .ctl:hover:not(:disabled) { transform: scale(1.05); }
  .vol { display: flex; align-items: center; gap: 6px; margin: 0 14px 0 30px; }
  .vol input { width: 72px; }
  .mute { width: 32px; height: 32px; border-radius: 8px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .mute:hover { background: var(--card); color: var(--text); }
  .mute.on { color: var(--accent); }
  .lufs { margin-left: auto; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .lufs span { font-size: 12px; font-weight: 600; color: var(--muted); }
  .lufs b { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }

  /* 카드: 템포 · 키 (같은 구조) */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { background: var(--card); border-radius: 16px; padding: 14px 18px 16px; }
  .card-h { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--muted); height: 26px; }
  .reset { font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 8px; border-radius: 7px; background: var(--panel); }
  .reset:hover:not(:disabled) { color: var(--text); }
  .val { display: flex; align-items: center; justify-content: center; gap: 12px; height: 64px; margin: 4px 0 8px; }
  .step {
    width: 34px; height: 34px; border-radius: 10px; background: var(--panel); font-size: 20px;
    display: inline-flex; align-items: center; justify-content: center; flex: none;
  }
  .big-num { font-size: 42px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .unit { font-size: 13px; font-weight: 700; color: var(--muted); margin-left: -6px; align-self: flex-end; padding-bottom: 20px; }
  .num {
    font: inherit; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; color: var(--text);
    background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 0; outline: none;
  }
  .num:focus { border-bottom-color: var(--accent); }
  .num::-webkit-inner-spin-button, .num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .num { -moz-appearance: textfield; }
  #tempoNum { font-size: 42px; line-height: 1; width: 3.4ch; }
  .keyval { min-width: 2ch; text-align: center; }

  /* 슬라이더 */
  input[type=range] {
    -webkit-appearance: none; appearance: none; height: 5px; border-radius: 999px; margin: 0;
    background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--line) var(--p, 0%));
    width: 100%; cursor: pointer; display: block;
  }
  input[type=range]:disabled { cursor: default; opacity: .5; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: #fff;
    border: 2px solid var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); }

  .chans { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .chans:empty { display: none; }
  .chip {
    font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: var(--card);
    cursor: pointer; user-select: none; display: flex; align-items: center; gap: 7px;
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .chip.off { opacity: .35; text-decoration: line-through; }

  @media (max-width: 600px) {
    .app { padding: 16px; }
    .top { flex-wrap: wrap; }
    .file { order: 3; flex-basis: 100%; }
    canvas { height: 170px; }
    .cards { grid-template-columns: 1fr; }
    .transport { grid-template-columns: auto 1fr; }
    .transport > .spacer { display: none; }
  }

/* 키 카드의 얼굴: 키를 올리면 둥실 떠오르며 햇살, 내리면 가라앉으며 먹구름과 비 (얼굴은 그대로) */
.key-h { display: inline-flex; align-items: center; }
.head { position: relative; display: inline-block; width: 50px; height: 60px; margin: -12px 0 -10px 10px;

  transition: transform .5s cubic-bezier(.34, 1.4, .5, 1); }

@keyframes faceIn { from { opacity: 0; } to { opacity: 1; } }

@keyframes sunSpin { to { transform: rotate(360deg); } }

/**
* Abstract base class for sample processing pipes.
*
* @remarks
* Manages input and output buffers for audio sample processing chains. Subclasses should implement
* specific processing logic for audio transformation or analysis. This class is not intended to be used
* directly, but as a base for concrete audio processing stages.
*
* @typeParam TInputBuffer - Concrete input buffer type (defaults to the generic `SampleBuffer` contract).
* @typeParam TOutputBuffer - Concrete output buffer type (defaults to `TInputBuffer` so input/output share the same buffer type unless a subclass opts into different types).
*/
var AbstractSamplePipe = class {
	/**
	* Input buffer for audio samples.
	*/
	_inputBuffer;
	/**
	* Output buffer for processed audio samples.
	*/
	_outputBuffer;
	/**
	* Constructs an AbstractSamplePipe.
	* @param options Constructor options.
	*
	* @remarks
	* When `createBuffers` is true, both factories are required so subclasses can
	* control exact buffer implementations without unsafe casting.
	*/
	constructor({ createBuffers = false, inputBufferFactory, outputBufferFactory } = {}) {
		if (createBuffers) {
			if (!inputBufferFactory || !outputBufferFactory) throw new Error("buffer factories are required when createBuffers is true");
			this._inputBuffer = inputBufferFactory();
			this._outputBuffer = outputBufferFactory();
		} else {
			this._inputBuffer = null;
			this._outputBuffer = null;
		}
	}
	/**
	* Gets the input buffer.
	* @returns The current input buffer instance, or null if not set.
	*/
	get inputBuffer() {
		return this._inputBuffer;
	}
	/**
	* Sets the input buffer.
	* @param inputBuffer The new input buffer instance, or null to unset.
	*/
	set inputBuffer(inputBuffer) {
		this._inputBuffer = inputBuffer;
	}
	/**
	* Gets the output buffer.
	* @returns The current output buffer instance, or null if not set.
	*/
	get outputBuffer() {
		return this._outputBuffer;
	}
	/**
	* Sets the output buffer.
	* @param outputBuffer The new output buffer instance, or null to unset.
	*/
	set outputBuffer(outputBuffer) {
		this._outputBuffer = outputBuffer;
	}
	/**
	* Clears both input and output buffers.
	*
	* @remarks
	* Resets the state of both input and output buffers, if present, by calling their `clear()` methods.
	*/
	clear() {
		this._inputBuffer?.clear();
		this._outputBuffer?.clear();
	}

/**
* Circular frame buffer for interleaved stereo audio samples.
*
* @remarks
* Implements a ring buffer for stereo audio, where each frame consists of two contiguous float values (left, right).
* Maintains a movable read cursor and appends at the logical end. Capacity grows automatically as needed while preserving frame order.
* Used for efficient, low-latency audio processing where buffer wraparound and dynamic resizing are required.
*/

	_buffer;

	_readFrame;

		this._frameCount = 0;

	* Allocated capacity expressed in frames.
	* @returns The number of frames the buffer can currently hold without resizing.
	*/
	get capacityFrames() {
		return this._capacityFrames;
	}
	/**
	* Number of buffered frames currently readable.
	* @returns The number of frames available for reading.
	*/
	get frameCount() {
		return this._frameCount;
	}
	/**
	* Clears the buffer without shrinking allocated capacity.
	*
	* @remarks

* @param b Second number to compare.

// LHIMSHIFT lifecycle adapter for the unmodified SoundTouchJS processor above.
class LhimShiftLivePitch extends SoundTouchProcessor {

// LHIMSHIFT 오디오 파일 재생기 (오디오 스레드에서 실행)
class LhimPlayerProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.eng = new LhimEngine(sampleRate); this.playing = false; this.n = 0; this.dead = false;
    this.port.onmessage = e => {

      else if (m.type === 'pause') this.playing = false;
      else if (m.type === 'seek') this.eng.seek(Math.round(m.t * sampleRate));
      else if (m.type === 'tempo') this.eng.setTempo(m.v);
      else if (m.type === 'pitch') this.eng.setPitch(m.v);
      else if (m.type === 'dispose') { this.dead = true; this.eng.ch = null; }

  }

// ---------- MIDI 파서 ----------
function parseMidi(buf) {
  const d = new DataView(buf);
  let p = 0;
  const str = n => { let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(d.getUint8(p + i)); p += n; return s; };
  const u32 = () => { const v = d.getUint32(p); p += 4; return v; };
  const u16 = () => { const v = d.getUint16(p); p += 2; return v; };
  const u8 = () => d.getUint8(p++);
  const vlq = () => { let v = 0, b; do { b = u8(); v = (v << 7) | (b & 0x7f); } while (b & 0x80); return v; };

  if (str(4) !== 'MThd') throw new Error('MIDI 파일이 아닙니다 (MThd 헤더 없음)');
  const hlen = u32();
  const format = u16(), ntrks = u16(), division = u16();
  p = 8 + hlen;

  const events = [];
  let trackNames = [];
  for (let t = 0; t < ntrks && p < d.byteLength; t++) {
    const id = str(4), len = u32(), end = p + len;
    if (id !== 'MTrk') { p = end; continue; }
    let tick = 0, status = 0, order = 0;
    while (p < end) {
      tick += vlq();
      let b = u8();
      if (b === 0xff) {
        const type = u8(), l = vlq(), start = p;
        if (type === 0x51) events.push({ tick, tr: t, o: order++, kind: 'tempo', mpqn: (d.getUint8(p) << 16) | (d.getUint8(p + 1) << 8) | d.getUint8(p + 2) });
        else if (type === 0x03 && !trackNames[t]) { trackNames[t] = new TextDecoder().decode(new Uint8Array(buf, p, l)); }
        p = start + l;
        if (type === 0x2f) break;
        continue;
      }
      if (b === 0xf0 || b === 0xf7) { const length = vlq(); p += length; continue; }
      if (b & 0x80) status = b; else p--; // running status
      const hi = status & 0xf0, ch = status & 0x0f;
      const a = u8();
      const bb = (hi === 0xc0 || hi === 0xd0) ? 0 : u8();
      events.push({ tick, tr: t, o: order++, kind: 'ch', hi, ch, a, b: bb });
    }
    p = end;
  }
  events.sort((x, y) => x.tick - y.tick || x.tr - y.tr || x.o - y.o);

  // 틱 → 초 변환 (템포 맵)
  let secPerTick;
  const smpte = division & 0x8000;
  if (smpte) {
    const fps = 256 - (division >> 8), tpf = division & 0xff;
    secPerTick = 1 / (fps * tpf);
  } else secPerTick = 0.5 / division; // 기본 120 BPM

  const chan = Array.from({ length: 16 }, () => ({ prog: 0, vol: 100 / 127, expr: 1, pan: 0, sus: false, held: [] }));
  const open = new Map(); // key ch*128+note → [note objs]
  const notes = [];
  const usedCh = new Set();
  const tempoMap = []; // [{t: 초, bpm}]
  let lastTick = 0, sec = 0;

  const endNote = (n, time) => { n.d = Math.max(0.02, time - n.t); };

  for (const e of events) {
    sec += (e.tick - lastTick) * secPerTick; lastTick = e.tick;
    if (e.kind === 'tempo') {
      if (!smpte) secPerTick = e.mpqn / 1e6 / division;
      const bpm = 60e6 / e.mpqn;
      const last = tempoMap[tempoMap.length - 1];
      if (last && Math.abs(last.t - sec) < 1e-9) last.bpm = bpm;       // 같은 시점 중복은 마지막 값
      else if (!last || Math.abs(last.bpm - bpm) > 1e-6) tempoMap.push({ t: sec, bpm });
      continue;
    }
    const c = chan[e.ch];
    const key = e.ch * 128 + e.a;
    if (e.hi === 0x90 && e.b > 0) {
      // 페달로 붙잡혀 있는 같은 음은 새 타건 시 끊는다
      c.held = c.held.filter(n => { if (n.note === e.a) { endNote(n, sec); return false; } return true; });
      const n = { t: sec, d: 0, note: e.a, vel: e.b, ch: e.ch, prog: c.prog, vol: c.vol * c.expr, pan: c.pan };
      notes.push(n); usedCh.add(e.ch);
      if (!open.has(key)) open.set(key, []);
      open.get(key).push(n);
    } else if (e.hi === 0x80 || (e.hi === 0x90 && e.b === 0)) {
      const q = open.get(key);
      if (q && q.length) {
        const n = q.shift();
        if (c.sus && e.ch !== 9) c.held.push(n); else endNote(n, sec);
      }
    } else if (e.hi === 0xc0) {
      c.prog = e.a;
    } else if (e.hi === 0xb0) {
      if (e.a === 7) c.vol = e.b / 127;
      else if (e.a === 11) c.expr = e.b / 127;
      else if (e.a === 10) c.pan = (e.b - 64) / 64;
      else if (e.a === 64) {
        const down = e.b >= 64;
        if (c.sus && !down) { c.held.forEach(n => endNote(n, sec)); c.held = []; }
        c.sus = down;
      } else if (e.a === 121) { c.vol = 100 / 127; c.expr = 1; c.pan = 0; }
    }
  }
  // 끝나지 않은 음 정리
  for (const q of open.values()) q.forEach(n => endNote(n, sec));
  chan.forEach(c => c.held.forEach(n => endNote(n, sec)));
  notes.forEach(n => { if (!n.d) n.d = 0.3; });
  notes.sort((a, b) => a.t - b.t);

  const duration = notes.reduce((m, n) => Math.max(m, n.t + n.d), 0);
  const chProg = {};
  notes.forEach(n => { if (!(n.ch in chProg)) chProg[n.ch] = n.prog; });
  if (!tempoMap.length || tempoMap[0].t > 0) tempoMap.unshift({ t: 0, bpm: 120 }); // 템포 이벤트 없으면 기본 120
  return { format, ntrks, notes, duration, tempoMap, usedCh: [...usedCh].sort((a, b) => a - b), chProg, trackNames };
}

const voices = new Set();

function initAudio() {
  if (ctx) return;

  master = ctx.createGain(); master.gain.value = outVol();

    const g = ctx.createGain(); g.gain.value = muted.has(i) ? 0 : 1; g.connect(master); chGain.push(g);
  }

  const ch = noiseBuf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;

function track(nodes, gain, stopAt) {
  const v = { nodes, gain, stopAt };
  voices.add(v);
  nodes[0].onended = () => { voices.delete(v); nodes.forEach(n => { try { n.disconnect(); } catch (_) {} }); };

  if (voices.size > 160) { const old = voices.values().next().value; killVoice(old, ctx.currentTime); }

function killVoice(v, now) {
  v.gain.gain.cancelScheduledValues(now);
  v.gain.gain.setTargetAtTime(0, now, 0.015);
  v.nodes.forEach(n => { if (n.stop) try { n.stop(now + 0.1); } catch (_) {} });

// 버전 고정: 원작자 저장소의 2019-03-07 커밋 (저장소가 바뀌거나 지워져도 jsDelivr가 이 버전을 계속 보관)
const GM_BASE = 'https://cdn.jsdelivr.net/gh/surikov/webaudiofontdata@23ca907d4370a04fd89ca483a92915e4d6159ab9/sound/';

  : `128${key.slice(1)}_0_FluidR3_GM_sf2_file.js`;

// 데이터 파일은 JS 객체 형태라 실행하지 않고 JSON으로 바꿔 읽는다
function parseWaf(text) {
  const body = text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1)
    .replace(/^\s*\/\/.*$/gm, '')            // 줄 단위 주석 (음원 base64 안의 '//'는 건드리지 않음)
    .replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g, '$1"$2":')

// 템포를 느리게 하면 긴 음이 반복 구간을 여러 번 돌아 '치지직'으로 들림 → 샘플마다
// ① 이음새 앞뒤 파형이 가장 잘 맞는 위치를 찾아 옮기고 ② 이음새에 8ms 크로스페이드를 넣는다.
function fixLoop(z) {
  if (!(z.loopStart > 1 && z.loopStart < z.loopEnd)) return;
  const b = z.buffer, r = b.sampleRate / z.sampleRate, d = b.getChannelData(0);
  const s0 = z.loopStart * r, e0 = z.loopEnd * r, L = 160;
  let best = 0, bestErr = Infinity;
  for (let off = -300; off <= 2600; off++) {
    const s = Math.round(s0 + off), e = Math.round(e0 + off);
    if (s < 0 || e + L >= d.length) continue;
    let err = 0, en = 1e-12;
    for (let i = 0; i < L; i += 2) { const a = d[s + i], c = d[e + i]; err += (a - c) * (a - c); en += a * a + c * c; }

    if (err < bestErr) { bestErr = err; best = off; }

  const s = Math.round(s0 + best), e = Math.round(e0 + best), N = Math.min(Math.round(b.sampleRate * 0.008), s);

    const x = b.getChannelData(c);
    for (let i = 0; i < N; i++) {                    // 반복 끝 직전을 반복 시작 직전과 섞어, 끝→시작이 이어지게
      const t = (i + 1) / N;
      x[e - N + i] = x[e - N + i] * (1 - t) + x[s - N + i] * t;

function gmLoad(key) {

      return ok;
    })().catch(() => { gmCache.delete(key); return null; });   // 실패하면 다음 곡에서 다시 시도
    gmCache.set(key, job);

function playNote(n, when, dur) {
  const zones = gmZones.get(n.ch === 9 ? 'd' + n.note : 'p' + n.prog);
  if (zones) return playSample(n, zones, when, dur);
  if (n.ch === 9) return playDrum(n, when);
  const T = TIMBRE[n.prog >> 3];
  const f = 440 * Math.pow(2, (n.note + keyShift - 69) / 12);
  const peak = Math.pow(n.vel / 127, 1.6) * n.vol * 0.22;

  const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
  o1.type = T.type; o2.type = T.t2;
  o1.frequency.value = f; o2.frequency.value = f;
  if (T.det) { o1.detune.value = -T.det; o2.detune.value = T.det; }
  const mix2 = ctx.createGain(); mix2.gain.value = T.det ? 1 : 0.5;
  const filt = ctx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = Math.min(f * T.bright * (0.6 + n.vel / 127), 14000);
  filt.Q.value = 0.5;
  const g = ctx.createGain();
  const pan = ctx.createStereoPanner(); pan.pan.value = n.pan;

  o1.connect(filt); o2.connect(mix2); mix2.connect(filt);
  filt.connect(g); g.connect(pan); pan.connect(chGain[n.ch]);

  // 엔벨로프: 어택 → 디케이(서스테인 레벨로) → 노트 끝에서 릴리스
  const atkEnd = when + T.a;
  const end = Math.max(when + dur, atkEnd + 0.01);
  // 음이 낮을수록 감쇠를 길게 (피아노류)
  const dec = T.perc ? T.d * (1 + (72 - n.note) / 40) : T.d;
  const sus = peak * T.s;
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(peak, atkEnd);
  g.gain.setTargetAtTime(sus, atkEnd, Math.max(dec, 0.05) / 3);
  const vEnd = sus + (peak - sus) * Math.exp(-(end - atkEnd) / (Math.max(dec, 0.05) / 3));
  g.gain.setValueAtTime(vEnd, end);
  g.gain.setTargetAtTime(0, end, T.r / 3);
  const stopAt = end + T.r * 2 + 0.05;

  o1.start(when); o2.start(when); o1.stop(stopAt); o2.stop(stopAt);
  track([o1, o2, mix2, filt, g, pan], g, stopAt);
}

function noiseSrc() { const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s; }

function playDrum(n, when) {
  const v = Math.pow(n.vel / 127, 1.4) * n.vol * 0.5;
  const out = ctx.createGain(); out.gain.value = 1;
  const pan = ctx.createStereoPanner(); pan.pan.value = n.pan;
  out.connect(pan); pan.connect(chGain[9]);
  const k = n.note;

  const tone = (f0, f1, len, amp, type = 'sine') => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, when);
    o.frequency.exponentialRampToValueAtTime(f1, when + len * 0.5);
    g.gain.setValueAtTime(amp, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + len);
    o.connect(g); g.connect(out);
    o.start(when); o.stop(when + len + 0.02);
    track([o, g], g, when + len);
  };
  const noise = (ftype, freq, len, amp, q = 1) => {
    const s = noiseSrc(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = ftype; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(amp, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + len);
    s.connect(f); f.connect(g); g.connect(out);
    s.start(when, Math.random()); s.stop(when + len + 0.02);
    track([s, f, g], g, when + len);
  };

  if (k === 35 || k === 36) tone(150, 42, 0.35, v * 1.3);
  else if (k === 38 || k === 40) { noise('bandpass', 1800, 0.18, v * 0.9, 0.7); tone(200, 150, 0.1, v * 0.5, 'triangle'); }
  else if (k === 37) noise('bandpass', 2500, 0.05, v * 0.6, 2);
  else if (k === 39) { noise('bandpass', 1200, 0.12, v * 0.9, 1.5); }
  else if (k === 42 || k === 44) noise('highpass', 7000, 0.05, v * 0.45);
  else if (k === 46) noise('highpass', 6500, 0.3, v * 0.4);
  else if (k === 49 || k === 57 || k === 52 || k === 55) noise('highpass', 5000, 1.2, v * 0.35);
  else if (k === 51 || k === 59 || k === 53) noise('bandpass', 6000, 0.45, v * 0.3, 0.8);
  else if ([41, 43, 45, 47, 48, 50].includes(k)) { const f = 80 + (k - 41) * 14; tone(f * 1.6, f, 0.35, v); }
  else if (k === 54 || k === 69 || k === 70) noise('highpass', 8000, 0.08, v * 0.3);
  else if (k === 56) tone(800, 780, 0.12, v * 0.4, 'square');
  else noise('bandpass', 3000, 0.08, v * 0.5, 1.5);
}

function stopAllVoices() {
  if (!ctx) return;
  const now = ctx.currentTime;
  [...voices].forEach(v => killVoice(v, now));
}

// ---------- 오디오 템포 감지 ----------
// 1) 3개 대역(저/중/고) 에너지의 로그 증가량 = 온셋 강도 (초당 FR 프레임)
// 2) 자기상관 + 120 BPM 중심 사전분포로 대략의 박 간격 추정
// 3) 그 주변 BPM 후보를 촘촘히 훑으며, 박 격자를 대어 온셋 합이 최대인 BPM·위상을 고른다
// 곡 앞부분(소리가 시작된 뒤 60초)만 본다 — 곡 중간 템포 변화는 따라가지 않음
function detectTempo(ab) {
  const FR = 200, sr = ab.sampleRate;
  const hop = Math.round(sr / FR);
  const src = [];
  for (let c = 0; c < Math.min(2, ab.numberOfChannels); c++) src.push(ab.getChannelData(c));
  let start = 0;
  while (start < ab.length && src.every(x => Math.abs(x[start]) < 0.003)) start++;
  if (start >= ab.length) start = 0;
  const chs = src.map(x => x.subarray(start));
  const maxLen = Math.min(chs[0].length, sr * 60);
  const kLo = 1 - Math.exp(-2 * Math.PI * 150 / sr), kMid = 1 - Math.exp(-2 * Math.PI * 3000 / sr);
  let lpLo = 0, lpMid = 0;
  const nF = Math.floor(maxLen / hop);
  const E = [new Float32Array(nF), new Float32Array(nF), new Float32Array(nF)];
  for (let f = 0; f < nF; f++) {
    let eL = 0, eM = 0, eH = 0;
    for (let i = f * hop, e = i + hop; i < e; i++) {
      const x = chs.length > 1 ? (chs[0][i] + chs[1][i]) * 0.5 : chs[0][i];
      lpLo += kLo * (x - lpLo); lpMid += kMid * (x - lpMid);
      const lo = lpLo, mid = lpMid - lpLo, hi = x - lpMid;
      eL += lo * lo; eM += mid * mid; eH += hi * hi;
    }
    E[0][f] = Math.log1p(eL / hop * 1e4); E[1][f] = Math.log1p(eM / hop * 1e4); E[2][f] = Math.log1p(eH / hop * 1e4);
  }
  const on = new Float32Array(nF);
  for (let f = 1; f < nF; f++) for (let b = 0; b < 3; b++) on[f] += Math.max(0, E[b][f] - E[b][f - 1]);
  // 국소 평균(0.5초) 빼서 박 성분만 남기기
  const W = FR / 2, o = new Float32Array(nF);
  let acc = 0;
  for (let f = 0; f < nF; f++) {
    acc += on[f]; if (f >= W) acc -= on[f - W];
    o[f] = Math.max(0, on[f] - acc / Math.min(f + 1, W));
  }
  // 살짝 번지게 (연주 흔들림 허용)
  const os = new Float32Array(nF);
  for (let f = 1; f < nF - 1; f++) os[f] = 0.25 * o[f - 1] + 0.5 * o[f] + 0.25 * o[f + 1];

  const lagOf = bpm => 60 * FR / bpm;
  const minLag = Math.floor(lagOf(220)), maxLag = Math.ceil(lagOf(50));
  const ac = new Float32Array(maxLag * 2 + 2);
  for (let L = minLag >> 1; L < ac.length && L < nF; L++) {
    let sum = 0; for (let f = 0; f + L < nF; f++) sum += o[f] * o[f + L];
    ac[L] = sum / (nF - L);
  }
  let best = -1, bestLag = lagOf(120);
  for (let L = minLag; L <= maxLag; L++) {
    const bpm = 60 * FR / L;
    const prior = Math.exp(-0.5 * Math.pow(Math.log2(bpm / 120) / 0.9, 2));
    const sc = (ac[L] + 0.5 * (ac[2 * L] || 0) + 0.25 * (ac[L >> 1] || 0)) * prior;
    if (sc > best) { best = sc; bestLag = L; }
  }
  const coarse = 60 * FR / bestLag;

  // 박 격자 정밀 탐색
  const comb = (bpm) => {
    const P = lagOf(bpm); let bestS = -1, bestPh = 0;
    for (let ph = 0; ph < P; ph += 1) {
      let sum = 0, cnt = 0;
      for (let t = ph; t < nF; t += P) { sum += os[Math.round(t)] || 0; cnt++; }
      const sAvg = sum / cnt;
      if (sAvg > bestS) { bestS = sAvg; bestPh = ph; }
    }
    return { s: bestS, ph: bestPh };
  };
  let bestBpm = coarse, bestC = comb(coarse);
  const span = coarse * 0.04;
  for (let b = coarse - span; b <= coarse + span; b += 0.05) {
    const c = comb(b);
    if (c.s > bestC.s) { bestC = c; bestBpm = b; }
  }
  // 정수 BPM에 아주 가까우면 정수로 (전자음악·클릭 트랙 곡 대부분)
  const rb = Math.round(bestBpm);
  if (Math.abs(rb - bestBpm) < 0.12 && comb(rb).s >= bestC.s * 0.98) { bestBpm = rb; bestC = comb(rb); }
  return { bpm: Math.round(bestBpm * 100) / 100, offset: start / sr + bestC.ph / FR };
}

// ---------- 롱텀 음량 (Integrated LUFS, ITU-R BS.1770-4) ----------
// K-가중 필터(고역 셸프 + RLB 하이패스) → 400ms 블록(75% 겹침)의 평균제곱
// → 절대 게이트 -70 LUFS → 상대 게이트(평균 -10 LU) → 남은 블록 평균
function integratedLufs(ab) {
  const fs = ab.sampleRate, nCh = ab.numberOfChannels;
  // 샘플레이트별 계수 (libebur128과 같은 설계식)
  let K = Math.tan(Math.PI * 1681.974450955533 / fs);
  const Vh = Math.pow(10, 3.999843853973347 / 20), Vb = Math.pow(Vh, 0.4996667741545416), Q1 = 0.7071752369554196;
  let a0 = 1 + K / Q1 + K * K;
  const s1 = { b0: (Vh + Vb * K / Q1 + K * K) / a0, b1: 2 * (K * K - Vh) / a0, b2: (Vh - Vb * K / Q1 + K * K) / a0,
               a1: 2 * (K * K - 1) / a0, a2: (1 - K / Q1 + K * K) / a0 };
  K = Math.tan(Math.PI * 38.13547087602444 / fs);
  const Q2 = 0.5003270373238773;
  a0 = 1 + K / Q2 + K * K;
  const s2 = { b0: 1, b1: -2, b2: 1, a1: 2 * (K * K - 1) / a0, a2: (1 - K / Q2 + K * K) / a0 };

  const seg = Math.round(fs * 0.1);               // 100ms 단위로 제곱합을 모아 400ms 블록 구성
  const nSeg = Math.floor(ab.length / seg);
  const segSum = new Float64Array(nSeg);
  // 채널 가중치: 5.1(L R C LFE Ls Rs) 기준, LFE 제외, 서라운드 1.41
  const weight = c => nCh >= 6 ? [1, 1, 1, 0, 1.41, 1.41][c] ?? 1 : 1;
  for (let c = 0; c < nCh; c++) {
    const G = weight(c); if (!G) continue;
    const x = ab.getChannelData(c);
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0, z1 = 0, z2 = 0;
    for (let sg = 0; sg < nSeg; sg++) {
      let acc = 0;
      for (let i = sg * seg, e = i + seg; i < e; i++) {
        const xi = x[i];
        const y = s1.b0 * xi + s1.b1 * x1 + s1.b2 * x2 - s1.a1 * y1 - s1.a2 * y2;
        x2 = x1; x1 = xi;
        const z = y - 2 * y1 + y2 - s2.a1 * z1 - s2.a2 * z2; // s2: b = [1, -2, 1]
        y2 = y1; y1 = y; z2 = z1; z1 = z;
        acc += z * z;
      }
      segSum[sg] += G * acc;
    }
  }
  const blocks = [];
  for (let b = 0; b + 4 <= nSeg; b++) blocks.push((segSum[b] + segSum[b + 1] + segSum[b + 2] + segSum[b + 3]) / (4 * seg));
  const L = z => -0.691 + 10 * Math.log10(z);
  const abs = blocks.filter(z => z > 0 && L(z) > -70);
  if (!abs.length) return -Infinity;
  const relGate = L(abs.reduce((a, z) => a + z, 0) / abs.length) - 10;
  const rel = abs.filter(z => L(z) > relGate);
  return L(rel.reduce((a, z) => a + z, 0) / rel.length);
}

// 파형 개요: 초당 PEAK_FR 구간마다 최대 진폭
const PEAK_FR = 100;
function computePeaks(ab) {
  const sr = ab.sampleRate, hop = Math.round(sr / PEAK_FR);
  const n = Math.ceil(ab.length / hop), out = new Float32Array(n);
  const chs = []; for (let c = 0; c < ab.numberOfChannels; c++) chs.push(ab.getChannelData(c));
  let max = 1e-6;
  for (let b = 0; b < n; b++) {
    let m = 0;
    for (let i = b * hop, e = Math.min(ab.length, i + hop); i < e; i += 2) for (const ch of chs) { const v = Math.abs(ch[i]); if (v > m) m = v; }
    out[b] = m; if (m > max) max = m;
  }
  for (let b = 0; b < n; b++) out[b] /= max;
  return out;
}

// ---------- 재생 제어 ----------
const $ = id => document.getElementById(id);
const playBtn = $('playBtn'), stopBtn = $('stopBtn'), seekEl = $('seek');
const ICON_PLAY = '<svg viewBox="0 0 24 24" width="26" height="26"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>', ICON_PAUSE = '<svg viewBox="0 0 24 24" width="26" height="26"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>';
// 슬라이더 채움 표시
// 숫자 칸 너비를 내용에 맞춤 (숫자와 BPM 사이 빈틈 없애기)
const fitNum = el => { el.style.width = (Math.max(2, String(el.value).length) + 0.4) + 'ch'; };
const fillRange = el => { const mn = +el.min, mx = +el.max; el.style.setProperty('--p', (mx > mn ? (el.value - mn) / (mx - mn) * 100 : 0) + '%'); };
const volEl = $('vol'), canvas = $('roll');
let volMuted = false;
const outVol = () => volMuted ? 0 : +volEl.value;
const tempoEl = $('tempo'), tempoNum = $('tempoNum');
const LOOKAHEAD = 0.2;

let song = null, playing = false, offset = 0, startCtx = 0, rate = 1, idx = 0, timer = null, seeking = false;
let player = null;   // 오디오 파일 재생기 { node, audioGain, script?, eng?, t, at }
const isAudio = () => song && song.kind === 'audio';
const muted = new Set();

const fmt = s => { s = Math.max(0, s); const m = Math.floor(s / 60); return m + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };
const curPos = () => isAudio() ? playerPos() : playing ? offset + (ctx.currentTime - startCtx) * rate : offset;
const lowerBound = t => { let lo = 0, hi = song.notes.length; while (lo < hi) { const m = (lo + hi) >> 1; if (song.notes[m].t < t) lo = m + 1; else hi = m; } return lo; };

function schedule() {
  if (!playing) return;
  const pos = curPos();
  const horizon = pos + LOOKAHEAD * rate;
  const notes = song.notes;
  while (idx < notes.length && notes[idx].t < horizon) {
    const n = notes[idx++];
    if (n.t < pos - 0.05) continue; // 놓친 음은 건너뜀
    const when = Math.max(startCtx + (n.t - offset) / rate, ctx.currentTime);
    playNote(n, when, n.d / rate);
  }
  if (pos >= song.duration + 0.4) { stop(); }
}

async function play() {
  if (!song) return;
  unlockAudioOutput();
  if (isAudio()) {
    if (!player) return;
    if (ctx.state !== 'running') await ctx.resume();
    if (!isAudio() || !player) return;
    if (player.t >= song.duration - 0.05) playerSeek(0);
    player.at = ctx.currentTime;
    playerMsg({ type: 'play' });
    playing = true;
    updateButtons(); return;
  }
  initAudio();
  if (ctx.state !== 'running') await ctx.resume();
  if (song.gmReady) {                     // GM 음원 받는 중이면 끝날 때까지 기다렸다가 재생
    const s = song;
    await s.gmReady;
    if (song !== s || playing) return;
  }
  if (offset >= song.duration) offset = 0;
  idx = lowerBound(offset);
  startCtx = ctx.currentTime + 0.05;
  playing = true;
  clearInterval(timer); timer = setInterval(schedule, 25);
  schedule();
  updateButtons();
}

function pause() {
  if (!playing) return;
  if (isAudio()) { player.t = playerPos(); player.at = ctx.currentTime; playerMsg({ type: 'pause' }); playing = false; updateButtons(); return; }
  offset = curPos();
  playing = false;
  clearInterval(timer);
  stopAllVoices();
  updateButtons();
}

function stop() {
  playing = false;
  if (player) { playerMsg({ type: 'pause' }); playerSeek(0); }
  clearInterval(timer);
  stopAllVoices();
  offset = 0;
  updateButtons();
}

function seekTo(t) {
  if (!song) return;
  setTimeout(() => syncNod(true), 60);
  t = Math.min(Math.max(0, t), song.duration);
  if (isAudio()) { playerSeek(t); return; }
  if (playing) {
    stopAllVoices();
    offset = t; startCtx = ctx.currentTime + 0.03; idx = lowerBound(t);
  } else offset = t;
}

function setRate(r) {
  if (isAudio()) { if (player) { player.t = playerPos(); player.at = ctx.currentTime; playerMsg({ type: 'tempo', v: r }); } rate = r; return; }
  if (playing) { offset = curPos(); startCtx = ctx.currentTime; }
  rate = r;
}

// ---------- 템포 ----------
// 곡의 첫 템포를 기준 BPM으로 삼고, 사용자가 정한 BPM과의 비율로 전체 재생 속도를 바꾼다.
// 곡 중간에 템포가 바뀌는 곡도 그 변화 비율은 그대로 유지된다.
const baseBpm = () => song ? song.tempoMap[0].bpm : 120;   // 파일이 없을 때는 120 BPM 기준으로 미리 눌러 볼 수 있게
const fileBpmAt = t => { const m = song.tempoMap; let i = m.length - 1; while (i > 0 && m[i].t > t) i--; return m[i].bpm; };
const r1 = x => Math.round(x * 10) / 10;

function setTempo(bpm, fromNumber = false) {
  if (!isFinite(bpm)) return;
  bpm = Math.min(300, Math.max(20, bpm));
  setRate(bpm / baseBpm());
  tempoEl.value = bpm;
  if (!fromNumber) tempoNum.value = r1(bpm);
  updateTempoInfo();
}

function updateTempoInfo() {
  fillRange(tempoEl); fitNum(tempoNum);
  $('tempoReset').disabled = Math.abs(rate - 1) < 1e-6;
}

function updateButtons() {
  $('saveBtn').disabled = !song || saving;
  $('tempoReset').disabled = Math.abs(rate - 1) < 1e-6;
  if (saving) $('saveMenu').hidden = true;
  updateKeyUI();
  playBtn.disabled = stopBtn.disabled = seekEl.disabled = !song;
  // 템포·키는 파일이 없어도 눌러 볼 수 있다 (재생·저장·위치 이동만 파일이 있어야 함)
  playBtn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  playBtn.setAttribute('aria-label', playing ? '일시정지' : '재생');
  $('stage').classList.toggle('empty', !song);
}

// ---------- 변경된 템포로 저장 ----------
let saving = false;

// MIDI: 템포 이벤트(FF 51 03)의 값만 비율대로 바꾼다. 음표·틱은 그대로라 원본과 동일한 곡이 된다.
function midiWithTempo(raw, r, key = 0) {
  const src = new Uint8Array(raw), d = new DataView(raw);
  if (d.getUint16(12) & 0x8000) throw new Error('SMPTE 타임코드 방식 MIDI는 템포를 바꿔 저장할 수 없습니다');
  const out = src.slice();
  const scale = mpqn => Math.min(0xffffff, Math.max(1, Math.round(mpqn / r)));
  const put = (at, v) => { out[at] = (v >> 16) & 255; out[at + 1] = (v >> 8) & 255; out[at + 2] = v & 255; };
  let p = 8 + d.getUint32(4), firstTrackData = -1, initialTempo = false;
  const vlq = () => { let v = 0, b; do { b = src[p++]; v = (v << 7) | (b & 0x7f); } while (b & 0x80); return v; };
  while (p + 8 <= src.length) {
    const id = String.fromCharCode(...src.subarray(p, p + 4)), len = d.getUint32(p + 4);
    p += 8; const end = p + len;
    if (id === 'MTrk') {
      if (firstTrackData < 0) firstTrackData = p;
      let status = 0, tick = 0;
      while (p < end) {
        tick += vlq();
        const b = src[p++];
        if (b === 0xff) {
          const type = src[p++], l = vlq();
          if (type === 0x51 && l === 3) { put(p, scale((src[p] << 16) | (src[p + 1] << 8) | src[p + 2])); if (tick === 0) initialTempo = true; }
          p += l;
          if (type === 0x2f) break;
          continue;
        }
        if (b === 0xf0 || b === 0xf7) { const length = vlq(); p += length; continue; }
        if (b & 0x80) status = b; else p--;
        const hi = status & 0xf0;
        // 음표 번호 이동 (노트온/오프/폴리 애프터터치, 드럼 채널 10 제외)
        if (key && (hi === 0x80 || hi === 0x90 || hi === 0xa0) && (status & 15) !== 9) out[p] = Math.max(0, Math.min(127, src[p] + key));
        p += (hi === 0xc0 || hi === 0xd0) ? 1 : 2;
      }
    }
    p = end;
  }
  if (initialTempo || firstTrackData < 0) return out;
  // 시작 시점 템포가 없는 파일: 기본 120 BPM도 변경 비율을 적용한다
  const ins = [0x00, 0xff, 0x51, 0x03, 0, 0, 0];
  const res = new Uint8Array(out.length + ins.length);
  res.set(out.subarray(0, firstTrackData));
  res.set(ins, firstTrackData);
  res.set(out.subarray(firstTrackData), firstTrackData + ins.length);
  const v = scale(500000);
  res[firstTrackData + 4] = (v >> 16) & 255; res[firstTrackData + 5] = (v >> 8) & 255; res[firstTrackData + 6] = v & 255;
  new DataView(res.buffer).setUint32(firstTrackData - 4, d.getUint32(firstTrackData - 4) + ins.length);
  return res;
}

// ---------- 오디오 처리 공통 ----------
const CANCEL = new Error('cancelled');
// 오래 걸리는 계산 중 화면이 멈추지 않도록 주기적으로 양보 (취소 확인 겸)
function makeYield(isCancelled) {
  let last = performance.now();
  return async () => {
    if (performance.now() - last < 30) return;
    await new Promise(r => setTimeout(r, 0));
    last = performance.now();
    if (isCancelled && isCancelled()) throw CANCEL;
  };
}

function makeFFT(N) {
  const lev = Math.log2(N), rev = new Uint32Array(N);
  for (let i = 0; i < N; i++) { let r = 0; for (let b = 0; b < lev; b++) r |= ((i >> b) & 1) << (lev - 1 - b); rev[i] = r; }
  const cs = new Float64Array(N / 2), sn = new Float64Array(N / 2);
  for (let i = 0; i < N / 2; i++) { cs[i] = Math.cos(2 * Math.PI * i / N); sn[i] = Math.sin(2 * Math.PI * i / N); }
  return (re, im, inv) => {
    for (let i = 0; i < N; i++) {
      const j = rev[i];
      if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
    }
    for (let size = 2; size <= N; size <<= 1) {
      const half = size >> 1, step = N / size;
      for (let i = 0; i < N; i += size) {
        for (let j = 0, k = 0; j < half; j++, k += step) {
          const wr = cs[k], wi = inv ? sn[k] : -sn[k];
          const a = i + j, b = a + half;
          const tr = re[b] * wr - im[b] * wi, ti = re[b] * wi + im[b] * wr;
          re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        }
      }
    }
    if (inv) for (let i = 0; i < N; i++) { re[i] /= N; im[i] /= N; }
  };
}

// 타임 스트레치 (음정 유지): 위상 보코더 + 위상 고정(identity phase locking) + 타격음 위상 리셋
// - 스펙트럼 봉우리마다 실제 주파수를 추정해 위상을 이어 가고, 주변 성분은 봉우리에 묶어 울림(phasiness)을 줄인다.
// - 드럼처럼 갑자기 커지는 순간에는 위상을 원본으로 되돌려 어택이 뭉개지지 않게 한다.
// - 스테레오는 가운데(L+R) 신호로 위상 진행을 계산해 양 채널에 같이 적용 → 좌우 이미지 유지.
// R > 1 이면 빨라짐(길이 1/R).
async function timeStretch(chs, sr, R, onProgress, isCancelled) {
  const len = chs[0].length, nCh = chs.length;
  const N = sr > 60000 ? 8192 : 4096, half = N / 2, H = N / 4, B = half + 1;
  const fft = makeFFT(N), yieldNow = makeYield(isCancelled);
  const win = new Float64Array(N);
  for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / N);
  const outLen = Math.max(1, Math.round(len / R));
  const out = chs.map(() => new Float32Array(outLen)), norm = new Float32Array(outLen);
  const pairs = [];
  for (let c = 0; c < nCh; c += 2) pairs.push([c, Math.min(c + 1, nCh - 1)]);
  const st = pairs.map(() => ({ prevPh: new Float64Array(B), prevSyn: new Float64Array(B), prevMag: new Float64Array(B), fluxAvg: 0, sinceReset: 99 }));
  const re = new Float64Array(N), im = new Float64Array(N);
  const Lr = new Float64Array(B), Li = new Float64Array(B), Rr = new Float64Array(B), Ri = new Float64Array(B);
  const mag = new Float64Array(B), ph = new Float64Array(B), syn = new Float64Array(B), peaks = new Int32Array(B);
  const TWO_PI = 2 * Math.PI, princ = x => x - TWO_PI * Math.round(x / TWO_PI);
  const kStart = -4, kEnd = Math.ceil(outLen / H) + 4;
  let prevCa = Math.round(kStart * H * R) - Math.round(H * R);

  for (let k = kStart; k < kEnd; k++) {
    const ca = Math.round(k * H * R), cs = k * H;
    const dA = Math.max(1, ca - prevCa); prevCa = ca;
    for (let pi = 0; pi < pairs.length; pi++) {
      const [cl, cr] = pairs[pi], s = st[pi], xl = chs[cl], xr = chs[cr], stereo = cl !== cr;
      for (let i = 0, idx = ca - half; i < N; i++, idx++) {
        const inR = idx >= 0 && idx < len;
        re[i] = inR ? xl[idx] * win[i] : 0;
        im[i] = inR && stereo ? xr[idx] * win[i] : 0;
      }
      fft(re, im, false);
      // 두 실수 신호를 한 번의 복소 FFT로 처리한 뒤 분리
      let maxMag = 0, sumMag = 0, flux = 0;
      for (let b = 0; b < B; b++) {
        const nb = (N - b) % N;
        Lr[b] = (re[b] + re[nb]) / 2; Li[b] = (im[b] - im[nb]) / 2;
        if (stereo) { Rr[b] = (im[b] + im[nb]) / 2; Ri[b] = (re[nb] - re[b]) / 2; }
        else { Rr[b] = Lr[b]; Ri[b] = Li[b]; }
        const mr = Lr[b] + Rr[b], mi = Li[b] + Ri[b];
        mag[b] = Math.hypot(mr, mi); ph[b] = Math.atan2(mi, mr);
        if (mag[b] > maxMag) maxMag = mag[b];
        sumMag += s.prevMag[b];
        const d = mag[b] - s.prevMag[b]; if (d > 0) flux += d;
      }
      // 타격음 감지: 스펙트럼 증가량이 평소보다 확 커지면 위상 리셋
      const f = flux / (sumMag + 1e-9);
      const transient = k === kStart || (f > 0.6 && f > 2.5 * s.fluxAvg && s.sinceReset > 2);
      s.fluxAvg = 0.85 * s.fluxAvg + 0.15 * f;
      s.sinceReset = transient ? 0 : s.sinceReset + 1;

      if (transient) {
        for (let b = 0; b < B; b++) syn[b] = ph[b];
      } else {
        let np = 0;
        const thr = maxMag * 1e-5;
        for (let b = 2; b < B - 2; b++) {
          const m = mag[b];
          if (m > thr && m > mag[b - 1] && m >= mag[b + 1] && m > mag[b - 2] && m >= mag[b + 2]) peaks[np++] = b;
        }
        if (!np) { for (let b = 0; b < B; b++) syn[b] = ph[b]; }
        else {
          for (let q = 0; q < np; q++) {
            const p = peaks[q], w = TWO_PI * p / N;
            const dphi = princ(ph[p] - s.prevPh[p] - w * dA);
            syn[p] = s.prevSyn[p] + (w + dphi / dA) * H;
          }
          // 봉우리 사이 성분은 가까운 봉우리의 위상 회전을 그대로 따른다
          let start = 0;
          for (let q = 0; q < np; q++) {
            const p = peaks[q], end = q + 1 < np ? (p + peaks[q + 1]) >> 1 : B - 1;
            const rot = syn[p] - ph[p];
            for (let b = start; b <= end; b++) if (b !== p) syn[b] = ph[b] + rot;
            start = end + 1;
          }
        }
      }
      // 회전 적용 → 두 채널을 다시 한 번의 역FFT로 합성
      for (let b = 0; b < B; b++) {
        const rot = syn[b] - ph[b], c = Math.cos(rot), sN = Math.sin(rot);
        const yLr = Lr[b] * c - Li[b] * sN, yLi = Lr[b] * sN + Li[b] * c;
        const yRr = Rr[b] * c - Ri[b] * sN, yRi = Rr[b] * sN + Ri[b] * c;
        re[b] = yLr - yRi; im[b] = yLi + yRr;
        if (b > 0 && b < half) { const nb = N - b; re[nb] = yLr + yRi; im[nb] = -yLi + yRr; }
        s.prevPh[b] = ph[b]; s.prevSyn[b] = syn[b]; s.prevMag[b] = mag[b];
      }
      fft(re, im, true);
      const ol = out[cl], or = out[cr];
      for (let i = 0, o = cs - half; i < N; i++, o++) {
        if (o < 0 || o >= outLen) continue;
        const w = win[i];
        ol[o] += re[i] * w;
        if (stereo) or[o] += im[i] * w;
        if (pi === 0) norm[o] += w * w;
      }
    }
    if (onProgress) onProgress((k - kStart) / (kEnd - kStart));
    await yieldNow();
  }
  for (const y of out) for (let i = 0; i < outLen; i++) if (norm[i] > 1e-6) y[i] /= norm[i];
  spliceTransients(chs, out, R, sr);
  return out;
}

// 타격음 보존: 위상 보코더는 창(약 90ms) 안에서 소리를 퍼뜨려 어택 앞에 번짐이 생긴다.
// 강한 어택을 찾아 그 주변(앞 50ms ~ 뒤 40ms)은 원본 소리를 제자리(시간 /R)에 그대로 붙이고 가장자리는 교차 페이드.
function spliceTransients(chs, out, R, sr) {
  const len = chs[0].length, outLen = out[0].length, nCh = chs.length;
  const hop = 256, nF = Math.floor(len / hop);
  const E = new Float32Array(nF);
  let maxE = 1e-12;
  for (let f = 0; f < nF; f++) {
    let e = 0;
    for (let c = 0; c < nCh; c++) { const x = chs[c]; for (let i = f * hop, end = i + hop; i < end; i++) e += x[i] * x[i]; }
    E[f] = e; if (e > maxE) maxE = e;
  }
  const A = Math.round(0.05 * sr), Bk = Math.round(0.04 * sr), X = Math.round(0.008 * sr);
  const minGap = Math.round(0.12 * sr);
  let lastOn = -Infinity;
  for (let f = 4; f < nF; f++) {
    const before = Math.min(E[f - 1], E[f - 2], E[f - 3], E[f - 4]) + maxE * 1e-6;
    // 6dB 이상 급상승 + 너무 작지 않은 소리 + 바로 다음 프레임보다 앞선 시작점
    if (E[f] < before * 4 || E[f] < maxE * 3e-5 || (f + 1 < nF && E[f + 1] >= E[f] * 4)) continue;
    const ti = f * hop;
    if (ti - lastOn < minGap) continue;
    lastOn = ti;
    const to = Math.round(ti / R);
    const a = to - A, b = to + Bk;
    if (a - X < 0 || b + X >= outLen || ti - A - X < 0 || ti + Bk + X >= len) continue;
    for (let c = 0; c < nCh; c++) {
      const x = chs[c], y = out[c];
      for (let o = a - X; o <= b + X; o++) {
        const i = ti + (o - to);
        let g = 1;
        if (o < a) g = (o - (a - X)) / X; else if (o > b) g = ((b + X) - o) / X;
        g = 0.5 - 0.5 * Math.cos(Math.PI * g);
        y[o] = y[o] * (1 - g) + x[i] * g;
      }
    }
  }
}

// 리샘플 (음높이 이동용): ratio 배 빠르게 읽는다 → 길이 1/ratio, 음높이 ×ratio
// 창 씌운 sinc 보간, 올릴 때는 차단 주파수를 낮춰 앨리어싱 방지
async function resample(chs, ratio, onProgress, isCancelled) {
  const len = chs[0].length, outLen = Math.max(1, Math.floor(len / ratio));
  const cut = Math.min(1, 1 / ratio), Z = 16, W = Math.ceil(Z / cut), OS = 256;
  const table = new Float32Array(W * OS + 2);
  for (let i = 0; i < table.length; i++) {
    const x = i / OS;
    const sinc = x === 0 ? 1 : Math.sin(Math.PI * cut * x) / (Math.PI * cut * x);
    table[i] = x >= W ? 0 : cut * sinc * (0.5 + 0.5 * Math.cos(Math.PI * x / W));
  }
  const yieldNow = makeYield(isCancelled);
  const out = chs.map(() => new Float32Array(outLen));
  for (let j = 0; j < outLen; j++) {
    const pos = j * ratio, i0 = Math.floor(pos), fr = pos - i0;
    for (let c = 0; c < chs.length; c++) {
      const x = chs[c]; let acc = 0;
      for (let t = -W + 1; t <= W; t++) {
        const idx = i0 + t; if (idx < 0 || idx >= len) continue;
        const d = Math.abs(t - fr) * OS, di = d | 0;
        acc += x[idx] * (table[di] + (table[di + 1] - table[di]) * (d - di));
      }
      out[c][j] = acc;
    }
    if ((j & 4095) === 0) { if (onProgress) onProgress(j / outLen); await yieldNow(); }
  }
  return out;
}

// 템포 비율 r(1 = 원래 빠르기)과 반음 key를 함께 적용한 채널 데이터
// 먼저 r/p 로 늘이고 p 로 리샘플 → 최종 길이 1/r, 음높이 ×p
async function processAudio(ab, r, key, onProgress, isCancelled) {
  let chs = []; for (let c = 0; c < ab.numberOfChannels; c++) chs.push(ab.getChannelData(c));
  const p = Math.pow(2, key / 12), R = r / p;
  const stretch = Math.abs(R - 1) > 1e-6, shift = key !== 0;
  const w1 = !stretch ? 0 : shift ? 0.8 : 1;   // 진행률 배분: 늘이기 80% + 리샘플 20%
  const prog = x => { if (onProgress) onProgress(x); };
  if (stretch) chs = await timeStretch(chs, ab.sampleRate, R, x => prog(x * w1), isCancelled);
  if (shift) chs = await resample(chs, p, x => prog(w1 + x * (1 - w1)), isCancelled);
  return chs;
}

// ---------- 저장 형식 ----------
function encodeWav(chs, sr, bits = 16) {
  const nCh = chs.length, n = chs[0].length, bytes = bits / 8, bps = bytes * nCh;
  const buf = new ArrayBuffer(44 + n * bps), v = new DataView(buf);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * bps, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, nCh, true); v.setUint32(24, sr, true);
  v.setUint32(28, sr * bps, true); v.setUint16(32, bps, true); v.setUint16(34, bits, true);
  w(36, 'data'); v.setUint32(40, n * bps, true);
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < nCh; c++) {
    const x = Math.max(-1, Math.min(1, chs[c][i]));
    if (bits === 16) { v.setInt16(o, x < 0 ? x * 32768 : x * 32767, true); o += 2; }
    else { const q = Math.round(x < 0 ? x * 8388608 : x * 8388607); v.setUint8(o, q & 255); v.setUint8(o + 1, (q >> 8) & 255); v.setUint8(o + 2, (q >> 16) & 255); o += 3; }
  }
  return new Blob([buf], { type: 'audio/wav' });
}

// MP3: 인코더(lamejs)는 처음 쓸 때만 인터넷에서 불러온다
let lamePromise = null;
function loadLame() {
  if (window.lamejs) return Promise.resolve(window.lamejs);
  return lamePromise ||= new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js';
    sc.onload = () => window.lamejs ? res(window.lamejs) : rej(new Error('MP3 인코더 오류'));
    sc.onerror = () => { lamePromise = null; sc.remove(); rej(new Error('MP3 인코더를 불러오지 못했습니다 (인터넷 연결 필요)')); };
    document.head.appendChild(sc);
  });
}

async function encodeMp3(chs, sr, onProgress, isCancelled) {
  const lame = await loadLame();
  if (![32000, 44100, 48000].includes(sr)) { chs = await resample(chs, sr / 44100, null, isCancelled); sr = 44100; }
  const nCh = Math.min(2, chs.length), enc = new lame.Mp3Encoder(nCh, sr, 320);
  const yieldNow = makeYield(isCancelled), BLK = 1152 * 16, n = chs[0].length, parts = [];
  const i16 = a => { const o = new Int16Array(a.length); for (let i = 0; i < a.length; i++) { const x = Math.max(-1, Math.min(1, a[i])); o[i] = x < 0 ? x * 32768 : x * 32767; } return o; };
  for (let i = 0; i < n; i += BLK) {
    const l = i16(chs[0].subarray(i, i + BLK));
    const b = nCh > 1 ? enc.encodeBuffer(l, i16(chs[1].subarray(i, i + BLK))) : enc.encodeBuffer(l);
    if (b.length) parts.push(new Uint8Array(b.buffer, b.byteOffset, b.length).slice());
    if (onProgress) onProgress(i / n);
    await yieldNow();
  }
  const last = enc.flush();
  if (last.length) parts.push(new Uint8Array(last.buffer, last.byteOffset, last.length).slice());
  return new Blob(parts, { type: 'audio/mpeg' });
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

async function saveAs(fmt) {
  if (!song || saving) return;
  const s = song, r = rate, key = keyShift;
  const bpm = String(r1(baseBpm() * r)).replace(/\.0$/, '');
  // 파일 이름: 바뀐 것만 붙인다. 이름에 이미 BPM 표기(BPM128, 128BPM 등)가 있으면 그 숫자만 바꾼다
  let stem = (s.name || 'song').replace(/\.[^.]+$/, '');
  if (Math.abs(r - 1) > 1e-6) {
    const bpmRe = /(\d+(?:\.\d+)?)(\s*BPM)|(BPM\s*)(\d+(?:\.\d+)?)/i;
    stem = bpmRe.test(stem)
      ? stem.replace(bpmRe, (m, n1, u1, u2, n2) => n1 !== undefined ? bpm + u1 : u2 + bpm)
      : `${stem}_${bpm}BPM`;
  }
  if (key) stem += `_Key${key > 0 ? '+' : ''}${key}`;
  const tag = '';
  const msg = t => { if (song === s) $('info').textContent = t; };
  saving = true; updateButtons();
  try {
    if (!isAudio()) {
      download(new Blob([midiWithTempo(s.raw, r, key)], { type: 'audio/midi' }), `${stem}${tag}.mid`);
    } else {
      const isMp3 = fmt === 'mp3', w = isMp3 ? 0.75 : 1;
      const show = x => msg(`저장 준비 중… ${Math.round(x * 100)}%`);
      show(0);
      if (isMp3) await loadLame();
      const chs = await processAudio(s.ab, r, key, x => show(x * w));
      const blob = isMp3
        ? await encodeMp3(chs, s.ab.sampleRate, x => show(w + x * (1 - w)))
        : encodeWav(chs, s.ab.sampleRate, fmt === 'wav24' ? 24 : 16);
      download(blob, `${stem}${tag}.${isMp3 ? 'mp3' : 'wav'}`);
    }
    msg('');
  } catch (err) {
    msg('저장 실패: ' + err.message);
    setTimeout(() => msg(''), 3000);
  }
  saving = false; updateButtons();
}

// ---------- 키 변경 ----------
// MIDI: 음표 번호를 옮겨 바로 반영 (드럼 채널 제외)
// 오디오: 지원 브라우저에서는 실시간 키 변경. 미지원 환경은 전체 변환으로 대체.
let keyShift = 0, keyJob = 0, keyTimer = null;
const keyLabel = k => k > 0 ? '+' + k : k < 0 ? '−' + -k : '0';

function updateKeyUI() {
  $('keyVal').textContent = keyLabel(keyShift);
  $('keyReset').disabled = keyShift === 0;
  $('keyUp').disabled = keyShift >= 12;
  $('keyDown').disabled = keyShift <= -12;
  // 키는 ±라서 가운데(0)부터 채운다
  const ks = $('keySlider'); ks.disabled = false; ks.value = keyShift;
  setFace(keyShift);
  const pc = (keyShift + 12) / 24 * 100, lo = Math.min(50, pc), hi = Math.max(50, pc);
  ks.style.background = `linear-gradient(to right, var(--line) ${lo}%, var(--accent) ${lo}%, var(--accent) ${hi}%, var(--line) ${hi}%)`;
}

function setKey(k) {
  k = Math.max(-12, Math.min(12, k));
  if (k === keyShift) return;
  keyShift = k; updateKeyUI();
  if (isAudio()) playerMsg({ type: 'pitch', v: Math.pow(2, keyShift / 12) });   // 재생 중 바로 적용
}

function resetKey() {
  keyJob++; clearTimeout(keyTimer); keyShift = 0; wxClear = true; updateKeyUI(); lastKey = 0;
}


// ---------- 파일 로딩 ----------
const CH_COLORS = Array.from({ length: 16 }, (_, i) => `hsl(${(i * 67 + 210) % 360} 70% 55%)`);

async function loadFile(file) {
  if (!file) return;
  const my = ++loadSeq;
  stop(); unloadAudio(); song = null; resetKey();
  $('chans').replaceChildren(); showLufs(); updateButtons();
  seekEl.value = 0; seekEl.max = 0; fillRange(seekEl);
  $('timeCur').textContent = $('timeTot').textContent = '0:00';
  $('fileName').textContent = file.name;
  $('fileName').title = file.name;
  $('info').textContent = '파일 읽는 중…';
  try {
    const buf = await file.arrayBuffer();
    if (my !== loadSeq) return;
    const head = String.fromCharCode(...new Uint8Array(buf, 0, Math.min(4, buf.byteLength)));
    if (head === 'MThd') loadBuffer(buf, file.name);
    else await loadAudio(file, buf, my);
  } catch (err) {
    if (my !== loadSeq) return;
    $('info').textContent = '읽기 실패: ' + err.message;
    updateButtons();
  }
}

// ---------- 오디오 파일 재생기 ----------
// 오디오 스레드(AudioWorklet)에서 SoundTouch가 원본을 직접 읽어 템포·키를 처리.
// AudioWorklet을 못 쓰는 환경에서는 같은 엔진을 ScriptProcessor로 실행.
let playerModule = null, EngineMain = null;
function playerMsg(m) {
  if (!player) return;
  if (player.script) {
    const e = player.eng;
    if (m.type === 'play') player.run = true;
    else if (m.type === 'pause') player.run = false;
    else if (m.type === 'seek') e.seek(Math.round(m.t * ctx.sampleRate));
    else if (m.type === 'tempo') e.setTempo(m.v);
    else if (m.type === 'pitch') e.setPitch(m.v);
  } else player.node.port.postMessage(m);
}
function playerSeek(t) { player.t = t; player.at = ctx.currentTime; playerMsg({ type: 'seek', t }); }
function playerPos() {                     // 지금 들리는 위치 (출력 지연만큼 빼서 화면·까딱이 소리와 맞게)
  if (!player) return 0;
  if (!playing) return player.t;
  const lat = (ctx.outputLatency || 0) + (ctx.baseLatency || 0);
  return Math.max(0, Math.min(song.duration, player.t + Math.max(0, ctx.currentTime - player.at - lat) * rate));
}
function onPlayerPos(t, at, ended) {
  if (!player) return;
  player.t = t; player.at = at;
  if (ended && playing) { playing = false; player.t = song.duration; updateButtons(); }
}
async function setupPlayer(ab) {
  const chs = [];
  for (let c = 0; c < Math.min(2, ab.numberOfChannels); c++) chs.push(new Float32Array(ab.getChannelData(c)));
  const audioGain = ctx.createGain(); audioGain.gain.value = outVol(); audioGain.connect(ctx.destination);
  const init = p => { p.t = 0; p.at = ctx.currentTime; playerMsg({ type: 'tempo', v: rate }); playerMsg({ type: 'pitch', v: Math.pow(2, keyShift / 12) }); };
  if (ctx.audioWorklet && typeof AudioWorkletNode !== 'undefined') {
    try {
      if (!playerModule) {
        playerModule = (async () => {
          const url = URL.createObjectURL(new Blob([$('livePitchSource').textContent], { type: 'application/javascript' }));
          try { await ctx.audioWorklet.addModule(url); } finally { URL.revokeObjectURL(url); }
        })().catch(err => { playerModule = null; throw err; });
      }
      await playerModule;
      const node = new AudioWorkletNode(ctx, 'lhimshift-player', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
      node.connect(audioGain);
      node.port.onmessage = e => { if (player && player.node === node) onPlayerPos(e.data.t, e.data.at, e.data.ended); };
      node.port.postMessage({ type: 'load', ch: chs }, chs.map(c => c.buffer));
      player = { node, audioGain }; init(player); return;
    } catch (_) { /* 아래 ScriptProcessor로 */ }
  }
  if (!EngineMain) {
    const src = $('livePitchSource').textContent;
    const core = src.slice(0, src.indexOf('//#region ../worklet-base'));
    EngineMain = new Function(core + '\nreturn LhimEngine;')();
  }
  const eng = new EngineMain(ctx.sampleRate); eng.load(chs);
  const node = ctx.createScriptProcessor(2048, 1, 2);   // 입력 0개는 Safari에서 오류 → 1개(연결 안 함)
  const p = { node, audioGain, script: true, eng, run: false };
  node.onaudioprocess = e => {
    const L = e.outputBuffer.getChannelData(0), R = e.outputBuffer.getChannelData(1);
    if (!p.run) { L.fill(0); R.fill(0); return; }
    eng.render(L, R, L.length);
    if (player === p) onPlayerPos(eng.played / ctx.sampleRate, ctx.currentTime, eng.ended);
    if (eng.ended) p.run = false;
  };
  node.connect(audioGain);
  player = p; init(player);
}
function disposePlayer() {
  if (!player) return;
  if (player.script) player.node.onaudioprocess = null;
  else { player.node.port.postMessage({ type: 'dispose' }); player.node.port.onmessage = null; }
  player.node.disconnect(); player.audioGain.disconnect();
  player = null;
}

// 아이폰: 무음(진동) 모드에서도 소리가 나도록
//  ① 오디오 세션을 '재생'으로 (iOS 16.4+)  ② 실제로 재생되는 무음 오디오를 반복 (그 이전 iOS용)
//  화면을 처음 터치하는 순간 한 번 실행하고, 그때 오디오도 깨운다
let outputUnlocked = false;

  const w = (o, t) => { for (let i = 0; i < t.length; i++) b[o + i] = t.charCodeAt(i); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  let bin = ''; for (let i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]);

}
function unlockAudioOutput() {

  if (outputUnlocked) return; outputUnlocked = true;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
  try {
    const a = new Audio(silentWavUrl());
    a.loop = true; a.setAttribute('playsinline', ''); a.muted = false;
    a.play().catch(() => { outputUnlocked = false; });   // 실패하면 다음 터치 때 다시
  } catch (_) {}
}
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}   // 오디오 시작 전에 미리
for (const ev of ['pointerdown', 'touchend', 'keydown']) {
  window.addEventListener(ev, () => { initAudio(); unlockAudioOutput(); }, { capture: true, passive: true });
}

function unloadAudio() {
  disposePlayer();
}

let loadSeq = 0;
async function loadAudio(file, buf, my) {
  stop(); unloadAudio(); song = null; offset = 0; resetKey();
  $('chans').innerHTML = '';
  $('info').textContent = '오디오 읽는 중…';
  showLufs();
  updateButtons();
  initAudio();
  let ab;
  try { ab = await ctx.decodeAudioData(buf); }
  catch (err) { if (my === loadSeq) $('info').textContent = '읽기 실패: 이 브라우저가 지원하지 않는 오디오 형식입니다.'; return; }
  if (my !== loadSeq) return;
  $('info').textContent = '템포 · 음량 분석 중…';
  await new Promise(r => setTimeout(r, 20)); // 안내 문구가 먼저 그려지도록
  const tempo = detectTempo(ab);
  const peaks = computePeaks(ab);
  const lufs = integratedLufs(ab);
  if (my !== loadSeq) return;

  try { await setupPlayer(ab); }
  catch (err) { if (my === loadSeq) $('info').textContent = '재생 준비 실패: ' + (err && err.message || err); return; }
  if (my !== loadSeq) { disposePlayer(); return; }

  song = { kind: 'audio', name: file.name, ab, duration: ab.duration, tempoMap: [{ t: 0, bpm: tempo.bpm }], detectedBpm: tempo.bpm, beatOffset: tempo.offset, peaks, notes: [], usedCh: [] };
  $('info').textContent = '';
  seekEl.max = song.duration;
  showLufs(lufs);
  rate = 1; setTempo(baseBpm());
  updateButtons();
  play();
}

function showLufs(v) {
  const el = $('lufs');
  $('lufsBox').hidden = v === undefined;
  if (v === undefined) return;
  el.textContent = isFinite(v) ? v.toFixed(1) : '−∞';
}

function loadBuffer(buf, name = '') {
  ++loadSeq;
  stop(); unloadAudio(); showLufs(); resetKey();
  try { song = parseMidi(buf); song.raw = buf; song.name = name; }
  catch (err) { song = null; $('info').textContent = '읽기 실패: ' + err.message; updateButtons(); return; }
  $('info').textContent = song.notes.length ? '' : '재생할 음표가 없습니다.';
  if (song.notes.length) song.gmReady = prepareGM(song);
  let lo = 127, hi = 0;
  song.notes.forEach(n => { if (n.ch !== 9) { lo = Math.min(lo, n.note); hi = Math.max(hi, n.note); } });
  if (lo > hi) { lo = 35; hi = 81; }
  song.lo = Math.max(0, lo - 3); song.hi = Math.min(127, hi + 3);
  seekEl.max = song.duration;
  muted.clear(); chGain.forEach(g => g.gain.value = 1);
  rate = 1; setTempo(baseBpm());
  renderChannels();
  updateButtons();
  play();
}

function renderChannels() {
  const box = $('chans'); box.innerHTML = '';
  song.usedCh.forEach(ch => {
    const el = document.createElement('button');
    el.type = 'button'; el.setAttribute('aria-pressed', 'true');
    el.className = 'chip';
    const label = ch === 9 ? '드럼' : FAMILY[song.chProg[ch] >> 3];
    el.innerHTML = `<i style="background:${CH_COLORS[ch]}"></i>Ch ${ch + 1} · ${label}`;
    el.onclick = () => {
      if (muted.has(ch)) muted.delete(ch); else muted.add(ch);
      el.classList.toggle('off', muted.has(ch));
      el.setAttribute('aria-pressed', String(!muted.has(ch)));
      if (ctx) chGain[ch].gain.setTargetAtTime(muted.has(ch) ? 0 : 1, ctx.currentTime, 0.01);
    };
    box.appendChild(el);
  });
}

seekEl.addEventListener('change', () => { seekTo(+seekEl.value); seeking = false; });
// 볼륨 · 음소거 (스피커를 누르면 음소거, 슬라이더를 움직이면 해제)
const SPK_ON = '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a9 9 0 0 1 0 12"/>';

canvas.addEventListener('click', e => {
  if (!song) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * canvas.clientWidth / rect.width;   // 화면 축소(zoom) 상태여도 그림 좌표로 환산
  seekTo(curPos() + (x - canvas.clientWidth * 0.2) / 90);
});

window.addEventListener('keydown', e => {
  if (!song || e.isComposing || e.keyCode === 229 || e.ctrlKey || e.metaKey || e.altKey) return;
  // Return/Enter resets the position, including after clicking a transport button.
  // Keep Enter available for confirming a typed BPM or IME composition.
  if (e.key === 'Enter' || e.code === 'Enter' || e.code === 'NumpadEnter') {
    if (e.target.closest('a[href], input:not([type="range"]), textarea, select, [contenteditable]')) return;
    e.preventDefault();
    seekTo(0);
    return;
  }
  if (e.target.closest('a[href], input, textarea, select, button, [contenteditable]')) return;
  if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); seekTo(curPos() + 5); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); seekTo(curPos() - 5); }
  else if (e.code === 'ArrowUp') { e.preventDefault(); nudge(1); }
  else if (e.code === 'ArrowDown') { e.preventDefault(); nudge(-1); }
});

// ---------- 피아노 롤 ----------
const g2 = canvas.getContext('2d');
function draw() {
  requestAnimationFrame(draw);

  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (canvas.width !== W * dpr || canvas.height !== H * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; }
  g2.setTransform(dpr, 0, 0, dpr, 0, 0);
  const css = getComputedStyle(document.documentElement);
  g2.fillStyle = css.getPropertyValue('--roll'); g2.fillRect(0, 0, W, H);

  const pos = song ? curPos() : 0;
  if (song) {
    updateTempoInfo();
    if (!seeking) { seekEl.value = pos; fillRange(seekEl); $('timeCur').textContent = fmt(pos / rate); $('timeTot').textContent = fmt(song.duration / rate); }
    const pps = 90, headX = W * 0.2;
    if (isAudio()) { drawWave(W, H, pos, pps, headX, css); return; }
    const lo = song.lo, hi = song.hi, rowH = H / (hi - lo + 1);
    // 옥타브 가이드 (C 음)
    g2.fillStyle = css.getPropertyValue('--grid');
    for (let k = lo; k <= hi; k++) if (k % 12 === 0) g2.fillRect(0, H - (k - lo + 1) * rowH, W, 1);

    const tMin = pos - headX / pps, tMax = pos + (W - headX) / pps;
    const notes = song.notes;
    for (let i = lowerBound(tMin - 12); i < notes.length && notes[i].t < tMax; i++) {
      const n = notes[i];
      if (n.t + n.d < tMin || muted.has(n.ch)) continue;
      const x = headX + (n.t - pos) * pps, w = Math.max(2, n.d * pps);
      const key = n.ch === 9 ? Math.min(hi, Math.max(lo, n.note)) : n.note;
      const y = H - (key - lo + 1) * rowH;
      const on = n.t <= pos && pos < n.t + n.d;
      g2.globalAlpha = on ? 1 : 0.55;
      g2.fillStyle = CH_COLORS[n.ch];
      g2.fillRect(x, y, w, Math.max(2, rowH - 1));
    }
    g2.globalAlpha = 1;
    g2.fillStyle = css.getPropertyValue('--accent');
    g2.fillRect(headX, 0, 2, H);
  } else {
    g2.fillStyle = css.getPropertyValue('--muted');
    g2.font = '600 14px Pretendard, -apple-system, sans-serif'; g2.textAlign = 'center';
    // 빈 화면 안내는 줄바꿈 가능한 HTML로 표시한다.
  }
}
function drawWave(W, H, pos, pps, headX, css) {
  const accent = css.getPropertyValue('--accent');
  // 박 격자 (원본 BPM 기준, 4박마다 진하게)
  const beat = 60 / baseBpm(), t0 = pos - headX / pps, t1 = pos + (W - headX) / pps;
  let k = Math.ceil((t0 - song.beatOffset) / beat);
  for (let t = song.beatOffset + k * beat; t < t1; t = song.beatOffset + (++k) * beat) {
    if (t < 0) continue;
    g2.fillStyle = css.getPropertyValue(k % 4 === 0 ? '--muted' : '--grid');
    g2.globalAlpha = k % 4 === 0 ? 0.5 : 1;
    g2.fillRect(headX + (t - pos) * pps, 0, 1, H);
  }
  g2.globalAlpha = 1;
  // 파형
  const mid = H / 2, peaks = song.peaks;
  for (let x = 0; x < W; x++) {
    const t = pos + (x - headX) / pps;
    const b = Math.floor(t * PEAK_FR);
    if (b < 0 || b >= peaks.length) continue;
    let m = 0; const b2 = Math.floor((t + 1 / pps) * PEAK_FR);
    for (let i = b; i <= b2 && i < peaks.length; i++) m = Math.max(m, peaks[i]);
    const h = Math.max(1, m * (H * 0.45));
    g2.fillStyle = accent;
    g2.globalAlpha = x < headX ? 0.9 : 0.4;
    g2.fillRect(x, mid - h, 1, h * 2);
  }
  g2.globalAlpha = 1;
  g2.fillStyle = accent;
  g2.fillRect(headX, 0, 2, H);
}


// ---------- 키 카드의 얼굴: 올리면 떠오르며 햇살, 내리면 가라앉으며 먹구름·비 ----------
// 얼굴 높이: 한 반음에 0.6px (±12면 ±7px) / 날씨 세기: ±1~4, ±5~8, ±9~12 세 단계
// 날씨: 마지막으로 누른 방향으로 정하고, 세기는 키 위치로 한 칸마다 조금씩
//  올리는 중(+) → 해: −12에서 +12로 갈수록 점점 크고 밝게 떠오르고, 높은 키에선 반짝이
//  내리는 중(−) → 구름·비: +12에서 −12로 갈수록 구름이 커지고 짙어지며 빗방울이 늘어남
//  0을 지나도 끊기지 않음. '↺ 원본'이나 새 파일을 열 때만 맑게 초기화

  lastKey = k;
  const f = wxDir > 0 ? (k + 12) / 24 : wxDir < 0 ? (12 - k) / 24 : 0;   // 0(약) ~ 1(최대)
  h.style.setProperty('--lift', (-k * 0.8) + 'px');   // 얼굴 높이는 키 값 (±12면 약 ±10px)
  const sun = wxDir > 0, rain = wxDir < 0;
  h.style.setProperty('--sunO', sun ? (0.3 + 0.7 * f).toFixed(2) : 0);
  h.style.setProperty('--sunS', sun ? (0.42 + 0.58 * f).toFixed(2) : 0.4);
  h.style.setProperty('--sunY', sun ? (16 - 22 * f).toFixed(1) + 'px' : '18px');   // 올라갈수록 더 높이 떠오름
  h.querySelectorAll('.spark').forEach((el, i) => el.classList.toggle('on', sun && f > 0.45 + i * 0.09));   // 밝을수록 반짝이 늘어남
  h.style.setProperty('--rainO', rain ? (0.55 + 0.45 * f).toFixed(2) : 0);
  h.style.setProperty('--rainS', rain ? (0.7 + 0.6 * f).toFixed(2) : 0.7);
  h.style.setProperty('--rainY', rain ? '0px' : '-8px');
  h.style.setProperty('--cloudB', rain ? (1.15 - 0.55 * f).toFixed(2) : 1);   // 내려갈수록 먹구름
  const drops = rain ? Math.max(1, Math.round(12 * f)) : 0;
  h.querySelectorAll('.drops i').forEach((d, i) => d.classList.toggle('off', i >= drops));
}

// ---------- 얼굴은 평소엔 숨어 있다가, 그 카드를 누르면 나타나고 잠시 뒤 스르륵 사라짐 ----------
const FACE_SHOW_MS = 5000;   // 마지막으로 누른 뒤 5초 동안 보였다가 스르륵 사라짐
function peekFace(el) {
  const wasShown = el.classList.contains('show');
  el.classList.remove('fading');
  el.classList.add('show');
  if (wasShown) el.style.animation = 'none';        // 이미 보이는 중이면 다시 나타나는 효과 없이 그대로
  else el.style.animation = '';
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(() => {                // 애니메이션으로 페이드 아웃 (전환 효과를 끄는 기기 설정에도 영향 없음)
    el.style.animation = '';
    el.classList.remove('show'); el.classList.add('fading');
  }, FACE_SHOW_MS);
}
{
  const [tempoCard, keyCard] = document.querySelectorAll('.cards .card');
  for (const ev of ['click', 'input']) {
    tempoCard.addEventListener(ev, () => peekFace($('tempoHead')), true);
    keyCard.addEventListener(ev, () => peekFace($('head')), true);
  }
}

// ---------- 템포 카드 얼굴: 곡의 박에 맞춰 까딱 ----------
// 재생 중: 곡 안에서 지금 몇 번째 박인지 계산해 박이 시작될 때 끄덕인다
//   오디오 = 템포 감지 때 찾은 첫 박 위치 + 원래 BPM,  MIDI = 파일의 템포 정보(곡 중 템포 변화 포함)
// 재생 안 할 때: 지금 BPM으로 혼자 까딱
function beatPosition() {
  if (!song) return null;
  const pos = curPos();
  if (isAudio()) return (pos - song.beatOffset) * baseBpm() / 60;
  const m = song.tempoMap;
  if (!song.beatsAt) {                      // 템포가 바뀌는 지점마다 누적 박 수 (한 번만 계산)
    song.beatsAt = [0];
    for (let i = 1; i < m.length; i++) song.beatsAt.push(song.beatsAt[i - 1] + (m[i].t - m[i - 1].t) * m[i - 1].bpm / 60);
  }
  let i = m.length - 1; while (i > 0 && m[i].t > pos) i--;
  return song.beatsAt[i] + (pos - m[i].t) * m[i].bpm / 60;
}
// 까딱임: 브라우저 표준 애니메이션(Web Animations)으로 돌리고, 속도(한 박 길이)와 시작점만 곡의 박에 맞춘다
// (CSS 변수로 애니메이션 속도를 바꾸는 방식은 일부 iOS Safari에서 멈춰 있어서 사용하지 않음)
const NOD_FRAMES = [
  { transform: 'translateY(3.5px) rotate(6deg)', offset: 0 },                    // 박: 가장 깊이 숙임
  { transform: 'translateY(0px) rotate(0deg)', offset: 0.32 },                   // 천천히 제자리
  { transform: 'translateY(0px) rotate(0deg)', offset: 0.84, easing: 'ease-in' }, // 다음 박 직전부터 숙이기
  { transform: 'translateY(3.5px) rotate(6deg)', offset: 1 }
];
let nodAnim = null, nodKey = '';
function syncNod(force) {
  const img = $('tempoHead').firstElementChild;
  const flowing = playing && ctx && ctx.state === 'running';
  let bpm = baseBpm() * rate;
  if (flowing && song && !isAudio()) bpm = fileBpmAt(curPos()) * rate;   // MIDI는 지금 위치의 템포
  const dur = 60 / bpm * 1000;                                          // 한 박 길이 (ms)
  let beat = flowing ? beatPosition() : null;
  if (beat === null) beat = performance.now() / dur;
  const phase = beat - Math.floor(beat);
  if (!img.animate) return;                                             // 아주 오래된 브라우저
  if (!nodAnim) { nodAnim = img.animate(NOD_FRAMES, { duration: dur, iterations: Infinity }); force = true; }
  const key = dur.toFixed(2) + (flowing ? 'p' : 'f');
  if (!force && key === nodKey) return;          // 속도·재생 상태가 그대로면 건드리지 않음
  nodKey = key;
  nodAnim.effect.updateTiming({ duration: dur });
  nodAnim.currentTime = phase * dur;             // 지금 박 위치로 맞춤
  if (nodAnim.playState !== 'running') nodAnim.play();
}
// 템포가 바뀌거나 재생/멈춤/이동이 있을 때 맞추고, 재생 중에는 3초마다 어긋남을 바로잡음
setInterval(() => syncNod(false), 250);
setInterval(() => { if (playing) syncNod(true); }, 3000);
syncNod(true);

// ---------- 점검 화면 (주소 끝에 ?debug 를 붙이면 표시) ----------
// 폰에서 소리가 안 날 때 원인을 찾기 위한 정보: 브라우저, 오디오 상태, 재생 방식, 오류
if (/[?&]debug\b/.test(location.search)) {
  const box = document.createElement('pre');
  box.style.cssText = 'position:fixed;left:6px;right:6px;top:6px;z-index:9999;pointer-events:none;margin:0;padding:8px 10px;max-height:45vh;overflow:auto;' +
    'font:11px/1.45 -apple-system,system-ui,sans-serif;white-space:pre-wrap;word-break:break-all;background:rgba(20,16,30,.88);color:#e9e3f5;border-radius:10px;';
  document.body.appendChild(box);
  const errs = [];
  window.addEventListener('error', e => errs.push('오류: ' + e.message + ' @' + (e.lineno || '')));
  window.addEventListener('unhandledrejection', e => errs.push('거부: ' + (e.reason && e.reason.message || e.reason)));
  setInterval(() => {
    box.textContent = [
      '브라우저: ' + navigator.userAgent,
      '보안환경: ' + isSecureContext + ' | AudioWorklet 지원: ' + !!(window.AudioWorkletNode),
      '오디오: ' + (ctx ? ctx.state + ' / ' + ctx.sampleRate + 'Hz / 지연 ' + Math.round(((ctx.outputLatency || 0) + (ctx.baseLatency || 0)) * 1000) + 'ms' : '아직 없음'),
      '오디오세션: ' + (navigator.audioSession ? navigator.audioSession.type : '미지원') + ' | 잠금해제: ' + outputUnlocked,
      '파일: ' + (song ? (song.kind || 'midi') + ' ' + fmt(song.duration) : '없음') + ' | 재생기: ' + (player ? (player.script ? 'ScriptProcessor' : 'AudioWorklet') : '없음'),
      '재생중: ' + playing + ' | 위치: ' + (song ? curPos().toFixed(2) : '-') + ' | 템포비율: ' + rate.toFixed(2) + ' | 키: ' + keyShift,
      '템포얼굴: ' + ($('tempoHead').classList.contains('show') ? '보임' : '숨김') + ' | 까딱: ' + (nodAnim ? nodAnim.playState + ' ' + Math.round(nodAnim.effect.getTiming().duration) + 'ms' : '없음') + ' | 기울기: ' + getComputedStyle($('tempoHead').firstElementChild).transform + ' | 박: ' + (song && playing ? (beatPosition() || 0).toFixed(2) : '-'),
      '안내문구: ' + ($('info').textContent || '(없음)'),
      ...errs.slice(-5)
    ].join('\n');
  }, 500);
}

// ---------- 시험용 소리 (주소에 ?demo 를 붙이면, 처음 터치할 때 드럼+음 20초짜리를 불러옴) ----------
if (/[?&]demo\b/.test(location.search)) {
  const loadDemo = () => {
    window.removeEventListener('pointerup', loadDemo, true);
    const sr = 44100, secs = 20, n = sr * secs, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, n * 2, true);
    const x = new Float32Array(n); for (let i = 0; i < n; i++) x[i] = Math.sin(2 * Math.PI * 330 * i / sr) * 0.08;
    for (let b = 0; 0.37 + b * 0.6 < secs - 0.3; b++) { const s0 = Math.floor((0.37 + b * 0.6) * sr); for (let i = 0; i < sr * 0.15; i++) { const t = i / sr; x[s0 + i] += Math.sin(2 * Math.PI * 60 * t) * Math.exp(-t * 14) * 0.6; } }
    for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, x[i])) * 32767, true);
    loadFile(new File([buf], 'demo_100bpm.wav', { type: 'audio/wav' }));
  };
  window.addEventListener('pointerup', loadDemo, true);
}

// ---------- 화면 높이에 맞추기 ----------
// 어떤 화면에서도 아래가 잘리지 않게: ① 파형 화면 높이를 줄이고(최소 110px) ② 그래도 넘치면 전체를 비율대로 축소
const appEl = $('drop');
let fitQueued = false;
function fitToScreen() {
  fitQueued = false;
  appEl.style.zoom = '';
  canvas.style.height = '';
  const bs = getComputedStyle(document.body);
  const avail = window.innerHeight - parseFloat(bs.paddingTop) - parseFloat(bs.paddingBottom);
  let over = appEl.offsetHeight - avail;
  if (over > 0) {
    const cut = Math.min(over, canvas.offsetHeight - 110);
    if (cut > 0) { canvas.style.height = (canvas.offsetHeight - cut) + 'px'; over -= cut; }
  }
  if (over > 0) appEl.style.zoom = Math.max(0.5, avail / appEl.offsetHeight).toFixed(3);
}
function queueFit() { if (!fitQueued) { fitQueued = true; requestAnimationFrame(fitToScreen); } }
window.addEventListener('resize', queueFit);
// 채널 칩·LUFS 표시처럼 내용이 늘거나 줄 때도 다시 맞춤
const fitWatch = new MutationObserver(queueFit);
fitWatch.observe(appEl, { subtree: true, attributes: true, attributeFilter: ['hidden'] });   // 표시/숨김
fitWatch.observe($('chans'), { childList: true });                                         // MIDI 채널 칩
if (document.fonts) document.fonts.ready.then(queueFit);

draw();
updateButtons();
fillRange(volEl);
fitToScreen();
</script>
